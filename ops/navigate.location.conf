# Included inside the existing songuu.top TLS server; other applications keep
# their explicit locations. Only the navigation homepage and news are switched.
location = / {
    root /opt/navigate/current/dist;
    try_files /index.html =404;
    add_header Cache-Control "no-store" always;
}
location = /index.html { root /opt/navigate/current/dist; add_header Cache-Control "no-store" always; }
location = /news { return 302 /news/$is_args$args; }
location = /news/ { root /opt/navigate/current/dist; try_files /index.html =404; add_header Cache-Control "no-store" always; }
location = /tools { return 302 /tools/; }
location = /tools/ { root /opt/navigate/current/dist; try_files /index.html =404; add_header Cache-Control "no-store" always; }
location ^~ /assets/ { root /opt/navigate/current/dist; try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
location = /data/bookmarks.json { root /opt/navigate/current/dist; add_header Cache-Control "no-cache"; }
location = /favicon.svg { root /opt/navigate/current/dist; }
location = /api/content/v1/news { proxy_pass http://127.0.0.1:5196; proxy_set_header Host $host; proxy_read_timeout 30s; }
location = /api/content/v1/news/calendar { proxy_pass http://127.0.0.1:5196; proxy_set_header Host $host; proxy_read_timeout 30s; }
location = /navigate-health { proxy_pass http://127.0.0.1:5196/healthz; proxy_set_header Host $host; }
location = /agent-build/news/ { return 302 /news/$is_args$args; }
location = /agent-build/news { return 302 /news/$is_args$args; }
location = /agent-build/news/article { return 302 /news/$is_args$args; }
location = /agent-build/news/index.html { return 302 /news/$is_args$args; }
location = /agent-build/news/article.html { return 302 /news/$is_args$args; }
location = /agent-build/api/content/v1/news { proxy_pass http://127.0.0.1:5196/api/content/v1/news; proxy_set_header Host $host; }
location = /agent-build/api/content/v1/news/calendar { proxy_pass http://127.0.0.1:5196/api/content/v1/news/calendar; proxy_set_header Host $host; }
