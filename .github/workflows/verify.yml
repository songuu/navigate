name: Verify navigation and news
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run backend:typecheck
      - run: npm run backend:test
      - run: npm run news:smoke
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: navigate-static
          path: dist/
